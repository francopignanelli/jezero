[build]
  command = "npm run build:netlify"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  VITE_DATA_VERSION = "data-v1"

# This is a three-page static site; no SPA fallback rewrite is required.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cesium/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# These files contain gzip bytes decoded by the game, not precompressed HTTP responses.
# Do not add Content-Encoding: Netlify controls that transport header.
[[headers]]
  for = "/data/game/*.bin.gz"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/data/tiles/terrain/*.terrain"
  [headers.values]
    Content-Type = "application/vnd.quantized-mesh"
