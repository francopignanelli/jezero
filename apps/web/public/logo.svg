<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Jezero</title>
  <defs>
    <radialGradient id="mars" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#F08C5C"/>
      <stop offset="0.55" stop-color="#E0784A"/>
      <stop offset="1" stop-color="#7A3A1F"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="32" cy="32" r="29"/></clipPath>
  </defs>
  <!-- Mars -->
  <circle cx="32" cy="32" r="29" fill="url(#mars)"/>
  <g clip-path="url(#disc)" fill="#7A3A1F" opacity="0.45">
    <ellipse cx="22" cy="20" rx="7" ry="3.5" transform="rotate(-18 22 20)"/>
    <ellipse cx="44" cy="27" rx="5" ry="2.4" transform="rotate(12 44 27)"/>
  </g>
  <!-- Perseverance's silhouette, standing on the planet's lower half -->
  <g fill="#1A0D06">
    <!-- mast and camera head -->
    <rect x="38.5" y="22" width="2.6" height="13"/>
    <rect x="35.5" y="18.5" width="9" height="4.6" rx="1"/>
    <!-- body and power source -->
    <rect x="17" y="34" width="27" height="7" rx="1.5"/>
    <path d="M17 36.5 L11 33 L12.2 31.2 L18 34.5 Z"/>
    <!-- arm -->
    <path d="M44 38 L50 36 L51 37.8 L45 40 Z"/>
    <!-- rocker-bogie and six wheels (three seen) -->
    <rect x="18" y="41" width="25" height="2.2"/>
    <circle cx="19.5" cy="46.5" r="3.8"/>
    <circle cx="30.5" cy="46.5" r="3.8"/>
    <circle cx="41.5" cy="46.5" r="3.8"/>
  </g>
</svg>
